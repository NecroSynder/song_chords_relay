<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More Than Able - Chord Chart</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>

    <aside id="legend-card" class="floating-legend">
        <div class="legend-header">
            <h4>Chord Legend</h4>
            <button id="legend-toggle" class="legend-toggle-btn" aria-label="Collapse Legend">─</button>
        </div>
        <div class="legend-content">
            <ul>
                <li><strong>1, 4, 5, 6</strong> - Nashville Numbers</li>
                <li><span class="obsidian-comment">~text~</span> - Form / Comments</li>
                <li><strong>sus</strong> - Suspended chord</li>
                <li><strong>add4</strong> - Added 4th note</li>
            </ul>
        </div>
    </aside>

    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
        <span id="theme-icon" aria-hidden="true">🌙</span>
    </button>

    <main id="chord-container" class="cards-container"></main>

</body>
</html>
