<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Charts Dashboard</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>

    <aside id="legend-card" class="floating-legend">
        <header class="legend-header">
            <h4>Chord Legend</h4>
            <button id="legend-toggle" class="legend-toggle-btn" aria-label="Toggle Legend" aria-expanded="true">─</button>
        </header>
        <div class="legend-content">
            <dl>
                <dt><strong>1, 4, 5, 6</strong></dt>
                <dd>Nashville Numbers</dd>
                
                <dt><strong>Chord Inversions /</strong></dt>
                <dd>Formula: Right Note / Bass Note</dd>
                
                <dt><strong>Parenthesis ( )</strong></dt>
                <dd>Passing Chord</dd>
                
                <dt><strong>sus</strong></dt>
                <dd>Suspended chord</dd>
                
                <dt><strong>add4</strong></dt>
                <dd>Added 4th note</dd>
            </dl>
        </div>
    </aside>

    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
        <span id="theme-icon" aria-hidden="true">🌙</span>
    </button>

    <main id="chord-container" class="cards-container"></main>

</body>
</html>
